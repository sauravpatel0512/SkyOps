version: 2

sources:
  - name: skyops_raw
    schema: raw
    # loaded_at is ingest wall-clock, not BTS fl_date (2024 dates would always look stale).
    tables:
      - name: flights
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 7, period: day}
      - name: weather_daily
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 7, period: day}
      - name: airports
        # Static hub lookup — no loaded_at column; skip freshness.
      - name: ingestion_runs
        # Load audit metadata written by Python loaders — no freshness SLA.
